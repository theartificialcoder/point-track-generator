[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dtf-eval"
version = "0.1.0"
description = "Offline point-trajectory generator and qualification harness"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.0",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dtf_eval = ["sparse_viewer.html", "neutral_track_viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
